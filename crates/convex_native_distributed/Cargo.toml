[package]
name = "convex_native_distributed"
description = "Distributed execution for convex_native: worker gRPC server + dispatcher client."
version = "0.1.0"
authors = ["Convex, Inc. <no-reply@convex.dev>"]
edition = "2024"
license = "LicenseRef-FSL-1.1-Apache-2.0"

[lib]
doctest = false

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
common = { workspace = true }
convex_native_core = { workspace = true }
database = { workspace = true }
errors = { workspace = true }
function_runner = { workspace = true }
headers = { workspace = true }
http = { workspace = true }
keybroker = { workspace = true }
model = { workspace = true }
parking_lot = { workspace = true }
pb = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
runtime = { workspace = true }
saffron = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sync_types = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
udf = { workspace = true }
usage_tracking = { workspace = true }
value = { workspace = true }
vector = { workspace = true }

[dev-dependencies]
# Everything in [dependencies] is already visible to tests/examples;
# only list here what's strictly test-only.
governor = { workspace = true }
indexing = { workspace = true }
search = { workspace = true }
sqlite = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread"] }
tokio-stream = { workspace = true, features = ["net"] }
tower = { workspace = true }

[lints]
workspace = true
