[package]
name = "convex_native"
description = "Batteries-included entry point: framework re-exports + a one-call backend server bootstrap."
version = "0.1.0"
authors = ["Convex, Inc. <no-reply@convex.dev>"]
edition = "2024"
license = "LicenseRef-FSL-1.1-Apache-2.0"

[lib]
doctest = false

[dependencies]
anyhow = { workspace = true }
async-broadcast = { workspace = true }
clap = { workspace = true }
cmd_util = { workspace = true }
common = { workspace = true }
convex_native_core = { workspace = true }
db_connection = { workspace = true }
futures = { workspace = true }
local_backend = { path = "../local_backend" }
runtime = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing = { workspace = true }

[lints]
workspace = true
