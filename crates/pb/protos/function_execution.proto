// Distributed function execution protocol for convex_native.
//
// Corresponds to Phase 3.1 of convex-native/IMPLEMENTATION_PLAN.md.
// A conductor process dispatches function calls over gRPC to a pool
// of identical worker binaries, each running the same native
// registry. Workers execute the handler against a local
// Database/Transaction and return the resulting value + any effects
// that need to land back at the conductor.
//
// This file is the contract; the client/server bindings generated
// from it live in `crates/convex_native_distributed/` (Phase 3.2+).

syntax = "proto3";

package function_execution;

import "common.proto";
import "google/protobuf/duration.proto";

service FunctionExecutionService {
  // Execute a single native function by name and return the result.
  // Queries and mutations both go through this RPC; actions too,
  // but their Response carries no transactional read/write set (the
  // worker either commits internally or surfaces subcall writes via
  // the run_query/run_mutation callback path).
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);

  // Lightweight readiness check the conductor uses for circuit
  // breaking and rolling updates (Phase 4.5, 4.7). Returns the
  // registry version the worker was built with so the conductor
  // can route around mismatched versions during a deploy.
  rpc Health(HealthRequest) returns (HealthResponse);
}

message ExecuteRequest {
  // Dotted registry name: matches NativeFunctionRegistration.name
  // exactly (not the JS module:function form).
  string name = 1;

  // UdfType — sanity-checks that the worker's handler kind matches
  // the conductor's expectation. Mismatch is a hard error.
  common.UdfType udf_type = 2;

  // TableNamespace as it appears on the conductor side. Encoded
  // as a string for forward-compat with future namespace
  // representations (today: "global" or a component id).
  string namespace = 3;

  // Args serialized with the same JSON encoding convex_native uses
  // internally: a single ConvexObject, serialized as one JSON
  // value.
  bytes args_json = 4;

  // Identity the call should run as, serialized through the
  // existing `convex_identity.Identity` wire format. Optional
  // because tests and internal paths sometimes omit it.
  optional bytes identity = 5;

  // Per-call soft timeout the worker should honor. The conductor
  // enforces a hard deadline on its side too.
  optional google.protobuf.Duration timeout = 6;

  // Execution context for tracing/audit (request_id, execution_id,
  // parent scheduled job, etc.).
  optional common.ExecutionContext execution_context = 7;

  // Minimum registry version the worker must be running. The
  // conductor populates this from the function's version tag
  // during a rolling update (Phase 4.7); if the worker is older
  // than `min_registry_version`, it should reject with
  // VERSION_MISMATCH.
  optional string min_registry_version = 8;
}

message ExecuteResponse {
  // The handler's Result<ConvexValue, E>. Uses the existing
  // FunctionResult shape (json_packed_value | js_error) so the
  // conductor can route it into the same UdfOutcome envelope JS
  // functions use.
  common.FunctionResult result = 1;

  // Wall-clock duration the handler ran for on the worker. The
  // conductor adds queue + network time on top for end-to-end
  // metrics.
  optional google.protobuf.Duration user_execution_time = 2;

  // Registry version on the worker that actually served the call
  // (not necessarily `min_registry_version` from the request — it
  // may be ahead). Conductors compare this across workers to detect
  // stragglers during a rolling deploy.
  optional string served_by_version = 3;

  // Worker logs captured during the handler run, already filtered
  // by LogBuffer::with_min_level(...) on the worker side. Shaped
  // like outcome.LogLine so the conductor can emit them alongside
  // JS log lines without translation.
  repeated string log_lines = 4;
}

message HealthRequest {
  // Empty — Health is a ping.
}

message HealthResponse {
  // Registry version the worker is running. Conductor uses this
  // to detect stragglers during a rolling deploy.
  string registry_version = 1;

  // True when the worker is ready to accept traffic. Workers that
  // are draining (Phase 4.3) or still warming their index cache
  // (Phase 4.6) return false here.
  bool accepts_traffic = 2;

  // Number of native functions registered on the worker. The
  // conductor can compare this across workers to notice
  // mismatched deployments (a registry mismatch is usually a
  // build-skew problem, not a rolling-update one).
  uint64 registered_functions = 3;

  // Number of handler invocations currently in flight. Used by
  // the conductor's P2C load balancer (Phase 3.4) to steer new
  // work towards the less busy worker.
  uint64 in_flight = 4;
}
