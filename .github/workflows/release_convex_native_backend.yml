name: Release Convex-Native Distributed Backend

# Phase 5.3 of convex-native/STATUS.md: build and push the
# distributed-topology backend image
# (convex-native/examples/deploy/docker/Dockerfile.backend) on
# release tags + on-demand. Pairs with the existing
# `release_self_hosted_images.yml` flow that publishes the
# monolith image; this is its sibling for the distributed
# topology.
#
# The image is published to GHCR under
# `ghcr.io/get-convex/convex-native-backend` so deployers can
# `docker pull` instead of rebuilding the backend per change.
# Workers ship the inventory at admission time; the image
# carries no deployer-specific function code.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v1.2.3). Defaults to the commit sha."
        required: false
        default: ""
  push:
    tags:
      - "convex-native-v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build convex-native backend image (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: [self-hosted, aws, "${{ matrix.arch }}", xlarge]
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/convex-native-v* ]]; then
            # Strip "refs/tags/convex-native-" prefix; "v1.2.3" stays as-is.
            tag="${GITHUB_REF#refs/tags/convex-native-}"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get UTC ISO8601 timestamp
        run: |
          echo "COMMIT_TIMESTAMP=$(git log -1 --format='%aI' | date -f - --utc '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Build and push convex-native backend image
        uses: docker/build-push-action@v6
        id: build-image
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: convex-native/examples/deploy/docker/Dockerfile.backend
          tags: |
            ghcr.io/get-convex/convex-native-backend
          cache-from: |
            type=s3,name=convex-native-backend-${{ matrix.arch }}-${{ github.sha }},prefix=buildkit,region=${{ vars.AWS_REGION }},bucket=${{ vars.RUNS_ON_S3_BUCKET_CACHE }}
            type=s3,name=convex-native-backend-${{ matrix.arch }}-${{ github.ref_name }},prefix=buildkit,region=${{ vars.AWS_REGION }},bucket=${{ vars.RUNS_ON_S3_BUCKET_CACHE }}
          cache-to: |
            type=s3,name=convex-native-backend-${{ matrix.arch }}-${{ github.sha }},mode=max,prefix=buildkit,region=${{ vars.AWS_REGION }},bucket=${{ vars.RUNS_ON_S3_BUCKET_CACHE }}
            type=s3,name=convex-native-backend-${{ matrix.arch }}-${{ github.ref_name }},mode=max,prefix=buildkit,region=${{ vars.AWS_REGION }},bucket=${{ vars.RUNS_ON_S3_BUCKET_CACHE }}
          outputs: push-by-digest=true,type=image,push=true
          provenance: false
          build-args: |
            VERGEN_GIT_SHA=${{ github.sha }}
            VERGEN_GIT_COMMIT_TIMESTAMP=${{ env.COMMIT_TIMESTAMP }}

      - name: Write digest
        uses: cloudposse/github-action-matrix-outputs-write@v1
        id: digest
        with:
          matrix-step-name: ${{ github.job }}
          matrix-key: convex-native-backend-${{ matrix.arch }}
          outputs: |-
            digest: ${{ steps.build-image.outputs.digest }}

  read:
    runs-on: ubuntu-latest
    needs: [build]
    outputs:
      result: ${{ steps.read.outputs.result }}
      image_tag: ${{ needs.build.outputs.image_tag }}
    steps:
      - uses: cloudposse/github-action-matrix-outputs-read@v1
        id: read
        with:
          matrix-step-name: build

  manifest:
    runs-on: ubuntu-latest
    needs: [read]
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-arch manifest
        env:
          IMAGE_TAG: ${{ needs.read.outputs.image_tag }}
          X64_DIGEST:
            ${{ fromJson(needs.read.outputs.result).digest.convex-native-backend-x64 }}
          ARM64_DIGEST:
            ${{ fromJson(needs.read.outputs.result).digest.convex-native-backend-arm64 }}
        run: |
          docker manifest create ghcr.io/get-convex/convex-native-backend:${IMAGE_TAG} \
            --amend ghcr.io/get-convex/convex-native-backend@${X64_DIGEST} \
            --amend ghcr.io/get-convex/convex-native-backend@${ARM64_DIGEST}
          docker manifest push ghcr.io/get-convex/convex-native-backend:${IMAGE_TAG}
