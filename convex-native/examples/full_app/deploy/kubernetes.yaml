# Kubernetes manifest for full_app workers. Replace IMAGE_TAG.
#
# Apply:
#   kubectl apply -f convex-native/examples/full_app/deploy/kubernetes.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: convex-full-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convex-full-app
  namespace: convex-full-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: convex-full-app
  template:
    metadata:
      labels:
        app: convex-full-app
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: convex_full_app:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 4567
          env:
            - name: CONVEX_MODE
              value: worker
            - name: CONVEX_WORKER_BIND_ADDR
              value: 0.0.0.0:4567
            - name: RUST_LOG
              value: info,convex_native=debug
          readinessProbe:
            grpc:
              port: 4567
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 4567
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "128Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: convex-full-app
  namespace: convex-full-app
spec:
  clusterIP: None
  selector:
    app: convex-full-app
  ports:
    - name: grpc
      port: 4567
      targetPort: grpc
      appProtocol: grpc
