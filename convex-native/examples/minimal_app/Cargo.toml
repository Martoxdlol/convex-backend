# Example `Cargo.toml` for a deployer's project. Not built by the
# workspace — listed here as a reading sample. To run it, copy
# `minimal_app/` into a standalone directory, point the deps at
# published versions (or git / path), and `cargo build`.

[package]
name = "minimal_app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }

# The two crates a deployer depends on. Pin to the version you
# deployed with — rolling-update routing (Phase 4.7) uses the
# binary's `convex_native::VERSION` constant as the
# `registry_version`.
convex_native = { path = "../../../crates/convex_native" }
convex_native_distributed = { path = "../../../crates/convex_native_distributed" }
