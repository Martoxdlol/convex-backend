# Conductor deployment. One replica by default — scale to 2 if
# you have a sync-aware HA scheme on top; the conductor doesn't
# own shared state itself, so multiple conductors are safe as
# long as your upstream load balancer picks one per session.
#
# The conductor resolves `CONVEX_WORKER_ENDPOINTS` against the
# headless worker Service. Periodic DNS re-resolution keeps the
# pool membership fresh across worker rollouts.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: convex-conductor
  namespace: convex
  labels:
    app: convex-conductor
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: convex-conductor
  template:
    metadata:
      labels:
        app: convex-conductor
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: conductor
          image: myco/convex-conductor:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          env:
            - name: CONVEX_MODE
              value: conductor
            # Headless Service DNS expands to every pod's IP. In
            # a deployer's own conductor binary, re-resolve this
            # periodically (e.g. every 10s) so newly-rolled
            # workers get picked up without a conductor restart.
            - name: CONVEX_WORKER_ENDPOINTS
              value: http://convex-worker.convex.svc.cluster.local:4567
            # Pin the minimum registry version during a deploy to
            # route around half-upgraded workers. Typically set
            # from a ConfigMap the deploy pipeline updates before
            # rolling the worker image.
            - name: CONVEX_MIN_REGISTRY_VERSION
              value: "0.1.0"
            - name: RUST_LOG
              value: info
          # If your conductor binary fronts an HTTP API for clients
          # (most deployer conductors do — see `DEPLOYMENT.md` §1.C),
          # expose and probe that port here:
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: convex-conductor
  namespace: convex
spec:
  type: ClusterIP
  selector:
    app: convex-conductor
  ports:
    - name: http
      port: 80
      targetPort: http
