# Development / demo topology: one conductor + two workers.
#
# Bring up:
#   docker compose up --build
#
# Drive traffic (conductor exec'd from outside):
#   docker compose exec conductor /usr/local/bin/my_conductor touch alice
#
# Observe rolling update: rebuild one worker and `docker compose up
# -d --build worker-a` — the conductor's P2C routing + single-retry
# failover means in-flight requests survive the bounce.

services:
  worker-a:
    build:
      context: ../../../..
      dockerfile: convex-native/examples/deploy/docker/Dockerfile.worker
    environment:
      CONVEX_MODE: worker
      CONVEX_WORKER_BIND_ADDR: 0.0.0.0:4567
      RUST_LOG: info
    ports:
      - "4567:4567"
    healthcheck:
      # Requires grpc_health_probe in the image if you want this;
      # as-is the image doesn't ship one, so compose skips the check.
      test: ["CMD-SHELL", "test -e /proc/1 || exit 1"]
      interval: 10s
      timeout: 2s
      retries: 3
    restart: unless-stopped

  worker-b:
    build:
      context: ../../../..
      dockerfile: convex-native/examples/deploy/docker/Dockerfile.worker
    environment:
      CONVEX_MODE: worker
      CONVEX_WORKER_BIND_ADDR: 0.0.0.0:4567
      RUST_LOG: info
    ports:
      - "4568:4567"
    restart: unless-stopped

  conductor:
    build:
      context: ../../../..
      dockerfile: convex-native/examples/deploy/docker/Dockerfile.conductor
    environment:
      CONVEX_MODE: conductor
      # `docker-compose` resolves service names via its own DNS —
      # same port on both workers because each container is its
      # own network namespace.
      CONVEX_WORKER_ENDPOINTS: http://worker-a:4567,http://worker-b:4567
      RUST_LOG: info
    depends_on:
      worker-a:
        condition: service_started
      worker-b:
        condition: service_started
    # Stays up for docker-compose exec — the minimal conductor
    # binary exits after one dispatch; swap this `command` for
    # `sleep infinity` during development, or replace with your
    # own long-running conductor.
    command: ["sleep", "infinity"]
